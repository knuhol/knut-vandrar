[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The active database URL is supplied by backend/src/settings.py.

[post_write_hooks]

[loggers]
root = true

[handlers]
console = console_handler

[formatters]
generic = generic_formatter

[logger_root]
level = WARN
handlers =
qualname = root

[handler_console]
class = StreamHandler
level = DEBUG
formatter = generic
args = (sys.stdout,)

[filter_sqlalchemy]
level = INFO
match = sqlalchemy
