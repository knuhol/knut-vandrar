name: Promote dev to main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-promotion-pr:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Create promotion PR if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --head dev --base main --state open --json number --jq '.[0].number')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base main \
              --head dev \
              --title "Promote dev to main" \
              --body "Promote the latest development changes to production."
          fi
