name: Format

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: Format and open pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Format frontend
        run: npm --workspace frontend run format:fix
      - name: Format and fix backend lint
        working-directory: backend
        run: |
          python -m ruff format .
          python -m ruff check --fix .
      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create formatting pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: codex/automatic-formatting
          delete-branch: true
          commit-message: "style: apply automatic formatting"
          title: "style: apply automatic formatting"
          body: "Applies the repository's Prettier and Ruff formatting rules."
